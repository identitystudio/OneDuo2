name: Build & Push RunPod Worker

on:
  push:
    branches: [main]
    paths:
      - 'runpod-worker/**'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./runpod-worker
          push: true
          no-cache: true
          tags: ghcr.io/${{ github.repository_owner }}/oneduo2-worker:latest
